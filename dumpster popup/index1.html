<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dumpster popup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" href="style.css">

<body>
    <!-- <div class="yahoo"> -->
<!-- header -->
        <section>
            <header>
            <div class="container">
                    <img src="./Group 1577709276.png" alt="pic">
                </div>
            </header>
            </section>

            <!--  -->
            <section class="pop-up">
                <div class="container">
                    <div class="row">
                        <div class="col-6 first-con">
                            <div class="headings">
                                <h1>Contractor or Homeowner?</h1>
                                <h4>Service Type</h4>
                            </div>
                            <div class="drop-down">
                                <select name="" id="">
                                    <option >Residential Homeowener</option>
                                    
                                </select>
                            </div>

                            <div class="btn">
                                <button>Request My Dumpster Now <img src="./Icon (1).png" alt=""></button>
                            </div>
                        </div>
                        <div class="col-6  sec-con">
                            <div class="head-img">
                                <img src="./Rectangle 5.png" alt="">
                            </div>
                            <div class="head-title">
                               <h1> MOST POPULAR SIZE 20 Yard Dumpster 1 to 14 Days</h1>
                            </div>
                            <div class="head-price">
                                <h3>Price: <span> $625.00</span></h3>
                            </div>
                            <div class="head-lists">
                                <ul>
                                    <li>Rental Time:<b> Up to 30 Days</b></li>
                                    <li>Included Tonnage:<b> 2 included</b></li>
                                    <li>Dimensions:<b> 8′ Wide X 4′ High X 18′ Long</b></li>
                                    <li>Additional Days:<b> $20/day</b></li>
                                    <li>Extra Weight:<b> $95/ton</b></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
    <!-- </div> -->
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
